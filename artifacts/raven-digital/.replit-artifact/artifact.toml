kind = "web"
previewPath = "/"
title = "Raven Digital"
description = "A premium interactive website planner for Raven Digital agency. Features a stunning landing page with hero, features, and pricing sections, plus a multi-step Website Planner wizard that guides business owners through choosing their perfect website — one animated decision at a time."
version = "1.0.0"
id = "artifacts/raven-digital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22591

[services.development]
run = "sh -c 'cd /home/runner/workspace && pnpm run dev'"

[services.production]
build = [ "sh", "-c", "cd /home/runner/workspace && pnpm run build" ]
serve = "static"
publicDir = "dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22591"
BASE_PATH = "/"
